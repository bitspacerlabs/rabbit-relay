# Build and deploy Rabbit Relay landing page + Fumadocs docs to GitHub Pages
name: Deploy Rabbit Relay site to Pages

on:
  push:
    branches: [main, docs-fumadocs-trial]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build Fumadocs
        run: npm run build
        working-directory: website

      - name: Prepare final site
        run: |
          rm -rf site-dist
          mkdir -p site-dist

          # With basePath + docsRoute='', Next.js output:
          # - _next/ at root (assets reference /rabbit-relay/docs/_next/...)
          # - pages at root (e.g. quickstart.html, not docs/quickstart.html)
          # - docs/ subdirectory contains page files
          #
          # We need _next/ inside docs/ for asset paths to resolve:
          cp -r website/out/* site-dist/
          mkdir -p site-dist/docs
          mv site-dist/_next site-dist/docs/_next

          # Move og/ into docs/ for OG image paths
          if [ -d site-dist/og ]; then
            mv site-dist/og site-dist/docs/og
          fi

          # Landing page at /rabbit-relay/
          cp index.html site-dist/index.html
          cp llms.txt site-dist/

          # Docs index redirect
          cat > site-dist/docs/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Redirecting...</title>
            <meta http-equiv="refresh" content="0;url=/rabbit-relay/docs/what-is-rabbit-relay">
          </head>
          <body>
            <p>If you are not redirected automatically, <a href="/rabbit-relay/docs/what-is-rabbit-relay">click here</a>.</p>
          </body>
          </html>
          REDIRECT

          # Landing page assets
          cp -r assets site-dist/assets

          # Generate redirect pages for old VitePress URLs
          ./scripts/generate-docs-redirects.sh site-dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
