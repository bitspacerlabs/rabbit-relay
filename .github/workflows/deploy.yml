# Build and deploy Rabbit Relay landing page + Fumadocs docs to GitHub Pages
name: Deploy Rabbit Relay site to Pages

on:
  push:
    branches: [main, docs-fumadocs-trial]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build Fumadocs
        run: npm run build
        working-directory: website

      - name: Prepare final site
        run: |
          rm -rf site-dist
          mkdir -p site-dist

          # basePath is /rabbit-relay, so output maps directly:
          # out/_next/     → /rabbit-relay/_next/     → site-dist/_next/
          # out/docs/      → /rabbit-relay/docs/      → site-dist/docs/
          # out/og/        → /rabbit-relay/og/        → site-dist/og/
          # out/index.html → /rabbit-relay/           → site-dist/index.html
          cp -r website/out/* site-dist/

          # Overwrite root index.html with landing page
          cp index.html site-dist/index.html
          cp llms.txt site-dist/

          # Landing page assets
          cp -r assets site-dist/assets

          # Generate redirect pages for old VitePress URLs
          ./scripts/generate-docs-redirects.sh site-dist

          # Generate docs root redirect to first doc page
          printf '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta http-equiv="refresh" content="0;url=/rabbit-relay/docs/what-is-rabbit-relay">\n<title>Redirecting…</title>\n</head>\n<body></body>\n</html>\n' > site-dist/docs/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
