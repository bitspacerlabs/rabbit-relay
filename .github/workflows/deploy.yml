# Build and deploy Rabbit Relay landing page + Fumadocs docs to GitHub Pages
name: Deploy Rabbit Relay site to Pages

on:
  push:
    branches: [main, docs-fumadocs-trial]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build Fumadocs
        run: npm run build
        working-directory: website

      - name: Prepare final site
        run: |
          rm -rf site-dist
          mkdir -p site-dist

          # Fumadocs output uses assetPrefix but no basePath.
          # Links: /docs/<slug>  Assets: /rabbit-relay/docs/_next/...
          # Pages are at out/docs/<slug>.html and out/docs/<slug>/
          # We need them at site-dist/docs/<slug>.html so GitHub Pages
          # serves /rabbit-relay/docs/<slug> correctly.

          mkdir -p site-dist/docs

          # Copy the entire docs/ directory contents
          cp -r website/out/docs/* site-dist/docs/

          # Copy docs.html as the docs index page
          cp website/out/docs.html site-dist/docs/index.html

          # Copy _next/ into docs/ for correct asset paths
          cp -r website/out/_next site-dist/docs/_next

          # Copy og/ into docs/ for correct OG image paths
          if [ -d website/out/og ]; then
            cp -r website/out/og site-dist/docs/og
          fi

          # Move root-level llms files
          cp website/out/llms.txt site-dist/
          cp website/out/llms-full.txt site-dist/

          # Move root-level static assets
          cp website/out/favicon.svg site-dist/
          cp website/out/favicon-light.svg site-dist/
          cp website/out/favicon-dark.svg site-dist/
          cp website/out/rabbit-relay-mini.svg site-dist/
          cp website/out/rabbit-relay-mini-dark.svg site-dist/

          # Landing page at /rabbit-relay/ (overwrites Fumadocs root)
          cp index.html site-dist/index.html

          # Landing page assets at /rabbit-relay/assets/
          cp -r assets site-dist/assets

          # Generate redirect pages for old VitePress URLs
          ./scripts/generate-docs-redirects.sh site-dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
