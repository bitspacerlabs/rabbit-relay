<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @media (prefers-color-scheme: dark) {
      .logo { fill: white; }
    }
    @media (prefers-color-scheme: light) {
      .logo { fill: black; }
    }
  </style>
  <g class="logo">
    <!-- Left ear -->
    <path d="M30 45 Q25 10 35 5 Q45 0 40 45 Z"/>
    <!-- Right ear -->
    <path d="M70 45 Q75 10 65 5 Q55 0 60 45 Z"/>
    <!-- Head -->
    <ellipse cx="50" cy="60" rx="28" ry="25"/>
    <!-- Inner ear left -->
    <path d="M32 43 Q28 15 35 10 Q42 5 39 43 Z" opacity="0.3"/>
    <!-- Inner ear right -->
    <path d="M68 43 Q72 15 65 10 Q58 5 61 43 Z" opacity="0.3"/>
  </g>
</svg>
