<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @media (prefers-color-scheme: dark) {
      .logo { fill: white; }
    }
    @media (prefers-color-scheme: light) {
      .logo { fill: black; }
    }
  </style>
  <g class="logo">
    <!-- Body -->
    <ellipse cx="55" cy="70" rx="25" ry="18"/>
    <!-- Head -->
    <circle cx="35" cy="45" r="18"/>
    <!-- Left ear -->
    <ellipse cx="25" cy="18" rx="6" ry="18" transform="rotate(-15 25 18)"/>
    <!-- Right ear -->
    <ellipse cx="40" cy="15" rx="6" ry="18" transform="rotate(5 40 15)"/>
    <!-- Eye -->
    <circle cx="28" cy="42" r="3"/>
    <!-- Nose -->
    <circle cx="18" cy="48" r="2"/>
    <!-- Tail -->
    <circle cx="80" cy="65" r="6"/>
  </g>
</svg>
